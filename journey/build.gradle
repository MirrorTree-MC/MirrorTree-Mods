group = 'top.bearcabbage'
version = '6.2.0+26.1.2'
base { archivesName = 'mirrortree' }

loom {
    splitEnvironmentSourceSets()
    mods {
        mirrortree {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    implementation 'maven.modrinth:starryskies:4.2.0+26.1'
    implementation project(':listorm')
    compileOnly 'maven.modrinth:essential-commands:0.39.0-mc26.1.1'
}
jar { from('LICENSE') }

sourceSets {
    validation {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('validationJar', Jar) {
    dependsOn validationClasses
    archiveBaseName = 'bedroom-regression'
    from sourceSets.validation.output
}
