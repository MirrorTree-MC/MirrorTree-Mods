name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build modules, GameTests and distribution packages
        run: ./gradlew build :journey:validationJar --no-daemon
      - name: Verify packages and write checksums
        run: python3 tools/verify_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: MirrorTree-Mods-26.1.2
          if-no-files-found: error
          compression-level: 0
          path: |
            build/distributions/MirrorTree-Mods-26.1.2-client.zip
            build/distributions/MirrorTree-Mods-26.1.2-server.zip
            build/distributions/SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MirrorTree-Mods-26.1.2
          path: release
      - name: Verify downloaded checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release/MirrorTree-Mods-26.1.2-client.zip \
            release/MirrorTree-Mods-26.1.2-server.zip \
            release/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_args[@]}"
