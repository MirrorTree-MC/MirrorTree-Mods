name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MirrorTree-Journey
      - uses: actions/checkout@v4
        with:
          repository: BaicaiBear/LIStorm
          path: LIStorm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LIStorm dependency
        working-directory: LIStorm
        run: bash gradlew jar
      - name: Build unified MirrorTree
        working-directory: MirrorTree-Journey
        run: bash gradlew build validationJar
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTree-26.1.2
          path: MirrorTree-Journey/build/libs/mirrortree-*.jar
