plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.nucleoid.xyz/releases' }
        maven { url = 'https://maven.puffish.net' }
        maven { url = 'https://api.modrinth.com/maven' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
    tasks.named('processResources') {
        inputs.property 'version', providers.provider { project.version.toString() }
        filesMatching('fabric.mod.json') { expand 'version': project.version }
    }
}

def releaseModules = ['listorm', 'journey', 'sync-sign-notice']
def artifactIndex = layout.buildDirectory.file('distribution-artifacts.json')
tasks.register('exportDistributionArtifacts') {
    def jars = releaseModules.collect { project(":${it}").tasks.named('jar') }
    dependsOn jars
    inputs.files jars.collect { it.flatMap { task -> task.archiveFile } }
    outputs.file artifactIndex
    doLast {
        artifactIndex.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
            jars.collect { [projectDirectory: it.get().project.projectDir.absolutePath,
                            artifact: it.get().archiveFile.get().asFile.absolutePath] }
        ))
    }
}

['client', 'server'].each { side ->
    tasks.register("${side}Distribution", Exec) {
        group = 'distribution'
        description = "Package production mods and update tools for the ${side}."
        dependsOn 'exportDistributionArtifacts'
        inputs.file artifactIndex
        inputs.files releaseModules.collect { project(":${it}").tasks.named('jar').flatMap { it.archiveFile } }
        inputs.files fileTree('tools') { include '*.py', 'distribution.json' }
        inputs.files fileTree('dist'), fileTree('listorm/licenses')
        inputs.files releaseModules.collect { file("${it}/LICENSE") }
        outputs.file layout.buildDirectory.file("distributions/MirrorTree-Mods-${minecraft_version}-${side}.zip")
        outputs.file layout.buildDirectory.file("distributions/MirrorTree-Mods-${minecraft_version}-${side}.zip.sha256")
        def python = providers.gradleProperty('python').getOrElse(
            System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
        commandLine python, 'tools/package_distribution.py', '--artifacts', artifactIndex.get().asFile,
            '--side', side
    }
}

tasks.register('assembleDistribution') {
    group = 'distribution'
    description = 'Build separate client and server installation ZIPs.'
    dependsOn 'clientDistribution', 'serverDistribution'
}
tasks.named('assemble') { dependsOn 'assembleDistribution' }
tasks.named('build') {
    dependsOn ':listorm:build', ':journey:build', ':sync-sign-notice:build'
}
