plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
group = 'top.bearcabbage'
repositories { maven { url = 'https://api.modrinth.com/maven' }; mavenCentral(); maven { url = 'https://maven.puffish.net' }; maven { url = 'https://maven.nucleoid.xyz/releases' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
    implementation 'maven.modrinth:starryskies:4.2.0+26.1'
    implementation files('../LIStorm/build/libs/lantern-in-storm-rebirth-6.0.0-alpha.4+26.1.2.jar')
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
jar { from('LICENSE') }

version = '6.1.0+26.1.2'
base { archivesName = 'mirrortree' }

sourceSets { validation { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += output + compileClasspath } }
tasks.register('validationJar', Jar) {
    dependsOn validationClasses
    archiveBaseName = 'bedroom-regression'
    from sourceSets.validation.output
}
