plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.nucleoid.xyz/releases' }
        maven { url = 'https://maven.puffish.net' }
        maven { url = 'https://api.modrinth.com/maven' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
    tasks.named('processResources') {
        inputs.property 'version', providers.provider { project.version.toString() }
        filesMatching('fabric.mod.json') { expand 'version': project.version }
    }
}

['client': ['listorm', 'journey', 'sync-sign-notice'],
 'server': ['listorm', 'journey']].each { side, modules ->
    tasks.register("${side}Distribution", Zip) {
        group = 'distribution'
        description = "Package production mods for the ${side}."
        archiveBaseName = 'MirrorTree-Mods'
        archiveVersion = minecraft_version
        archiveClassifier = side
        destinationDirectory = layout.buildDirectory.dir('distributions')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        from("dist/README-${side}.txt") { rename { 'README.txt' } }
        modules.each { module ->
            def modProject = project(":${module}")
            // Select the production jar task, never all files in build/libs.
            from(modProject.tasks.named('jar').flatMap { it.archiveFile }) { into 'mods' }
            from(modProject.file('LICENSE')) { into "licenses/${module}" }
            if (module == 'listorm') {
                from(modProject.file('licenses')) { into 'licenses/listorm/origins' }
            }
        }
    }
}

tasks.register('assembleDistribution') {
    group = 'distribution'
    description = 'Build separate client and server installation ZIPs.'
    dependsOn 'clientDistribution', 'serverDistribution'
}
tasks.named('assemble') { dependsOn 'assembleDistribution' }
tasks.named('build') {
    dependsOn ':listorm:build', ':journey:build', ':sync-sign-notice:build'
}
