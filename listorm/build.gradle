plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/releases' }
    maven { url = 'https://maven.puffish.net' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'lantern-in-storm' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation 'eu.pb4:trinkets:4.0.1+26.1'
    implementation 'net.puffish:skillsmod:0.19.1+26.1:fabric'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('licenses') { into 'licenses' }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'storm-test'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Optional runtime fixture; the production mod has no Farmer's Delight dependency.
if (providers.gradleProperty('farmersDelightTestJar').isPresent()) {
    dependencies { gametestImplementation files(providers.gradleProperty('farmersDelightTestJar').get()) }
}

if (providers.gradleProperty('compatTestDir').isPresent()) {
    dependencies { gametestImplementation fileTree(dir: providers.gradleProperty('compatTestDir').get(), include: ['*.jar']) }
}
