group = 'top.bearcabbage.lanterninstorm'
version = '6.0.0-alpha.6+26.1.2'
base { archivesName = 'lantern-in-storm-rebirth' }

loom {
    splitEnvironmentSourceSets()
    mods {
        'lantern-in-storm' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Trinkets injects public Minecraft interfaces needed by dependent projects.
    api 'eu.pb4:trinkets:4.0.1+26.1'
    // Pufferfish Skills 0.19.2 (26.1 Fabric), matching the deployed runtime.
    implementation 'maven.modrinth:hqQqvaa4:Uhs6RdHK'
    implementation 'net.puffish:attributesmod:0.8.2+26.1:fabric'
}

jar {
    from('LICENSE')
    from('licenses') { into 'licenses' }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'storm-test'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Optional runtime fixture; the production mod has no Farmer's Delight dependency.
if (providers.gradleProperty('farmersDelightTestJar').isPresent()) {
    dependencies { gametestImplementation files(providers.gradleProperty('farmersDelightTestJar').get()) }
}

if (providers.gradleProperty('compatTestDir').isPresent()) {
    dependencies { gametestImplementation fileTree(dir: providers.gradleProperty('compatTestDir').get(), include: ['*.jar']) }
}

// Existing codec/copy regression uses a main class rather than JUnit.
test { enabled = false }
tasks.register('checkSkillData', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.bearcabbage.mirrorskills.SkillDataCheck'
}
check.dependsOn checkSkillData
